<!DOCTYPE html>
<html lang="ru" translate="no">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The site is Russian-only; browser auto-translation (Yandex/Chrome)
         rewrites text nodes and crashes React with "removeChild" errors on
         dynamic pages (admin schedule). Opt out of automatic translation. -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#074462" />
    <meta
      name="description"
      content="«РАСсвет» — центр развития детей с задержками развития в Ханты-Мансийске. Индивидуальные занятия, опытные специалисты, поддержка семьи, расписание и документы в личном кабинете."
    />
    <meta property="og:title" content="Центр развития детей «РАСсвет»" />
    <meta
      property="og:description"
      content="Центр развития детей с задержками развития в Ханты-Мансийске: индивидуальные занятия, опытные специалисты, поддержка семьи."
    />
    <meta property="og:type" content="website" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>РАСсвет — центр развития детей с задержками развития</title>
    <link rel="preconnect" href="https://vk.com" crossorigin>
    <link rel="dns-prefetch" href="https://vk.com">
    <link rel="dns-prefetch" href="https://userapi.com">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

    -->
  </body>
</html>
