---
- name: Verify production secret prerequisites without exposing values
  hosts: production
  become: true
  gather_facts: false

  tasks:
    - name: Validate protected environment files and running configuration
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          root_env=/opt/rassvet/.env
          backend_env=/opt/rassvet/backend/.env
          [[ -s "$root_env" && -s "$backend_env" ]]
          [[ $(stat -c %a "$root_env") == 600 ]]
          [[ $(stat -c %a "$backend_env") == 600 ]]

          read_value() {
            awk -v wanted="$2" \
              'index($0, wanted "=") == 1 { value=substr($0, length(wanted) + 2) } END { print value }' \
              "$1" | tr -d '\r'
          }

          require_secret() {
            local value lowered value_length
            value=$(read_value "$1" "$2")
            value=${value#\"}
            value=${value%\"}
            value_length=$(printf %s "$value" | wc -c)
            [[ $value_length -ge $3 ]]
            lowered=$(printf %s "$value" | tr '[:upper:]' '[:lower:]')
            case "$lowered" in
              password|postgres|changeme|change_me|secret|replace_me|replace-with-*|replace_with_*)
                return 1
                ;;
            esac
          }

          require_secret "$root_env" DB_PASSWORD 24
          require_secret "$root_env" REDIS_PASSWORD 24
          require_secret "$backend_env" DB_PASSWORD 24
          require_secret "$backend_env" REDIS_PASSWORD 24
          require_secret "$backend_env" JWT_SECRET 32
          require_secret "$backend_env" EMAIL_PASSWORD 16
          require_secret "$backend_env" VK_COMMUNITY_TOKEN 32

          [[ $(read_value "$root_env" DB_PASSWORD) == $(read_value "$backend_env" DB_PASSWORD) ]]
          [[ $(read_value "$root_env" REDIS_PASSWORD) == $(read_value "$backend_env" REDIS_PASSWORD) ]]
          [[ $(read_value "$backend_env" IS_PRODUCTION) == true ]]

          cd /opt/rassvet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker inspect redis | grep -- '--requirepass' >/dev/null
          docker exec backend sh -c \
            'test -n "$JWT_SECRET" && test -n "$DB_PASSWORD" && test -n "$REDIS_PASSWORD"'
          curl --fail --silent --show-error --max-time 10 \
            https://rassvethm.ru/api/health >/dev/null
        executable: /bin/bash
      changed_when: false
      register: production_secret_validation
      failed_when: production_secret_validation.rc != 0

    - name: Confirm production secret prerequisites
      ansible.builtin.debug:
        msg: >-
          Required production secrets exist, are non-empty, reject known
          placeholders, agree across environment files, and pass runtime checks.
