<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<title>Генератор Slug для новостей</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				max-width: 600px;
				margin: 50px auto;
				padding: 20px;
			}
			input,
			button {
				width: 100%;
				padding: 10px;
				margin: 10px 0;
				font-size: 16px;
				box-sizing: border-box;
			}
			#result {
				background: #f0f0f0;
				padding: 15px;
				border-radius: 5px;
				margin-top: 20px;
			}
			.copy-btn {
				background: #4caf50;
				color: white;
				border: none;
				cursor: pointer;
				border-radius: 4px;
			}
			.copy-btn:hover {
				background: #45a049;
			}
		</style>
	</head>
	<body>
		<h1>Генератор Slug для новостей</h1>
		<p>Введите заголовок на русском, получите slug для Directus</p>

		<input type="text" id="title" placeholder="Введите заголовок..." />
		<button onclick="generateSlug()">Сгенерировать Slug</button>

		<div id="result" style="display: none">
			<strong>Slug:</strong>
			<input type="text" id="slug" readonly />
			<button class="copy-btn" onclick="copySlug()">Скопировать</button>
		</div>

		<script>
			function generateSlug() {
				const title = document.getElementById('title').value
				if (!title) return

				const translitMap = {
					а: 'a',
					б: 'b',
					в: 'v',
					г: 'g',
					д: 'd',
					е: 'e',
					ё: 'yo',
					ж: 'zh',
					з: 'z',
					и: 'i',
					й: 'y',
					к: 'k',
					л: 'l',
					м: 'm',
					н: 'n',
					о: 'o',
					п: 'p',
					р: 'r',
					с: 's',
					т: 't',
					у: 'u',
					ф: 'f',
					х: 'h',
					ц: 'ts',
					ч: 'ch',
					ш: 'sh',
					щ: 'sch',
					ъ: '',
					ы: 'y',
					ь: '',
					э: 'e',
					ю: 'yu',
					я: 'ya',
				}

				let slug = title.toLowerCase()

				for (const [rus, lat] of Object.entries(translitMap)) {
					slug = slug.replace(new RegExp(rus, 'g'), lat)
				}

				slug = slug.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')

				document.getElementById('slug').value = slug
				document.getElementById('result').style.display = 'block'
			}

			function copySlug() {
				const slugInput = document.getElementById('slug')
				slugInput.select()
				document.execCommand('copy')
				alert('Slug скопирован!')
			}
		</script>
	</body>
</html>
